name: Henge M4 installer disk sizes IPA
on:
  push:
    branches:
      - feat/installer-select-disk-size-20261108
  workflow_dispatch:
    inputs:
      henge_sha:
        description: Exact fork commit (leave empty to build this workflow commit)
        required: false
      husk_sha:
        description: Exact Husk dependency commit
        required: true
        default: afe83d45b31194c4cc9f7b3db7ec2c757db8346e
permissions:
  contents: read
jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      HUSK: ${{ github.workspace }}/Husk
      IOS_DEPS: ${{ github.workspace }}/Husk/build/ios-arm64/sysroot
      HENGE_SHA: ${{ inputs.henge_sha || github.sha }}
      HUSK_SHA: ${{ inputs.husk_sha || 'afe83d45b31194c4cc9f7b3db7ec2c757db8346e' }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout build tooling from this fork
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ci
          persist-credentials: false
      - name: Checkout storage expansion and earlier fixes from this fork
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.henge_sha || github.sha }}
          fetch-depth: 0
          path: Henge
          persist-credentials: false
      - name: Checkout pinned Husk dependencies
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Leviidev/Husk
          ref: ${{ inputs.husk_sha }}
          path: Husk
          persist-credentials: false
      - name: Verify source and ARM64 Xcode 27 toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HENGE_SHA" =~ ^[0-9a-f]{40}$ && "$HUSK_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcodebuild -version | head -1 | grep -E '^Xcode (27|[3-9][0-9])([. ]|$)'
          xcrun --sdk iphoneos --show-sdk-version
          test "$(git -C Henge rev-parse HEAD)" = "$HENGE_SHA"
          test "$(git -C Husk rev-parse HEAD)" = "$HUSK_SHA"
          git -C Henge merge-base --is-ancestor f0eec63e9d62966133f861d8b57aedc890437467 HEAD
          git -C Henge merge-base --is-ancestor da7332e32134f0aa14a67f8cbf67307e68f5367e HEAD
          git -C Henge merge-base --is-ancestor e740e26fa0efcf62feb10ef85a7ab360281428c0 HEAD
          mkdir -p "$HOME/Desktop" artifacts
      - name: Test physical mouse event routing
        shell: bash
        run: |
          set -euo pipefail
          ./Henge/ios/scripts/check_mouse_buttons.sh | tee artifacts/mouse-tests.log
      - name: Test GPU replay and Metal draw parameters
        shell: bash
        run: |
          set -euo pipefail
          ./Henge/ios/scripts/check_gpu.sh | tee artifacts/gpu-tests.log
      - name: Verify sparse file growth on runner without allocating the new capacity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, tempfile
          with tempfile.TemporaryDirectory() as folder:
              path = os.path.join(folder, "test.img")
              with open(path, "wb") as out:
                  out.truncate(64 << 30)
              before = os.stat(path).st_blocks * 512
              with open(path, "r+b") as out:
                  out.truncate(128 << 30)
              after = os.stat(path)
              assert after.st_size == (128 << 30)
              assert after.st_blocks * 512 - before < (16 << 20), "growth allocated too much real storage"
          print("PASS: sparse extension does not preallocate 128 GiB")
          PY
      - name: Verify storage settings and offline resize guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          model = Path("Henge/ios/Henge/Machines.swift").read_text()
          view = Path("Henge/ios/Henge/MacSettingsView.swift").read_text()
          for s in ["func expandDisk(", "henge_vm_state() == 0", "truncate(atOffset:", "try handle.synchronize()", "guest GPT/APFS still requires expansion"]:
              assert s in model, f"Missing storage guard: {s}"
          for s in ["Expand virtual disk", "Free iPad storage", "An external backup is recommended but optional", "APFS must be expanded separately"]:
              assert s in view, f"Missing UI instruction: {s}"
          print("PASS: storage resize source guards present")
          PY
      - name: Verify new macOS installation disk size selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          screen = Path('Henge/ios/Henge/InstallView.swift').read_text()
          installer = Path('Henge/ios/Henge/Installer.swift').read_text()
          checks = [
            (screen, 'Picker("Disk size", selection: $diskGiB)'),
            (screen, 'ForEach(Installer.diskSizesGiB'),
            (screen, 'diskGiB: diskGiB'),
            (installer, 'static let diskSizesGiB = [64, 128, 256, 512]'),
            (installer, 'static let defaultDiskGiB = 128'),
            (installer, 'guard Self.diskBytes(forGiB: diskGiB) != nil'),
            (installer, 'diskBytes: capacity'),
            (installer, 'truncate(atOffset: UInt64(capacity))'),
            (installer, 'actualSize?.int64Value == capacity'),
          ]
          for source, text in checks:
              assert text in source, f"Installer capacity wiring missing: {text}"
          assert 'truncate(atOffset: UInt64(64) << 30)' not in installer
          print('PASS: selectable new-VM disk sizes are passed to the sparse disk image')
          PY
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in xcodegen cmake meson ninja pkg-config autoconf automake libtool; do
            brew list --versions "$tool" >/dev/null || brew install "$tool"
          done
          command -v rustup || { curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.92.0; }
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
          rustup target add aarch64-apple-ios
          dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - name: Build Husk networking libraries and remote pairing
        shell: bash
        run: |
          set -euo pipefail
          cd "$HUSK"
          ./scripts/fetch_sources.sh
          ./scripts/build_ios.sh libffi glib libslirp
          ./scripts/build_rppairing_ios.sh
          # StikJIT is the official prebuilt framework vendored by Husk.
          test -s src/app/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework/StikJIT
          for lib in libslirp libglib-2.0 libintl libpcre2-8; do
            test -s "build/ios-arm64/sysroot/lib/$lib.a"
          done
      - name: Build full Henge and package with official scripts
        shell: bash
        run: |
          set -euo pipefail
          cd Henge
          ./ios/scripts/fetch_deps.sh
          ./tools/build_ios_restore.sh
          make ios-lib
          # The official script redirects its log before xcodebuild creates this directory.
          mkdir -p ios/build
          ./ios/scripts/package_ipa.sh
          cp "$HOME/Desktop/Henge.ipa" ../artifacts/Henge-M4-Installer-DiskSizes.ipa
      - name: Validate packaged IPA and record provenance
        shell: bash
        run: python3 ci/.github/scripts/validate-ipa.py artifacts/Henge-M4-Installer-DiskSizes.ipa Henge Husk
      - name: Upload validated IPA
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Henge-M4-Installer-DiskSizes.ipa
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Record artifact link
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          echo "Validated IPA: $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/build-manifest.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Henge-build-diagnostics
          path: |
            Henge/ios/build/*.buildlog
            Husk/build/logs/
            artifacts/gpu-tests.log
            artifacts/mouse-tests.log
          if-no-files-found: ignore
