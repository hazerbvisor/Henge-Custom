name: Publish Henge 0.2 M4 SafeBoot IPA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-henge-02-m4-safe-boot.yml
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: "${{ github.token }}"
      SOURCE_RUN: "42586953725"
      SOURCE_SHA: "1157586ab48d3b8536329cb202cca1948c89e600"
      ARTIFACT: "Henge-0.2-M4-SafeBoot"
      IPA: "Henge-0.2-M4-SafeBoot.ipa"
      EXPECTED_SHA256: "5cf6c66041816e4198d215f1739a0cf63de6e8796c6fd36535852ef80c0c35c5"
      RELEASE_TAG: "henge-0.2-m4-safe-boot-20261109"

    steps:
      - name: Check the pinned successful Xcode 27 build
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq \
            '"status=\(.status) conclusion=\(.conclusion) sha=\(.head_sha)"'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)" = "$SOURCE_SHA"

      - name: Download IPA from successful workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir release
          test -s "release/$IPA"
          test -s release/build-manifest.json

      - name: Verify original SHA256, IPA bundle, and provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, zipfile
          root = pathlib.Path("release")
          file = root / os.environ["IPA"]
          expected = os.environ["EXPECTED_SHA256"]
          actual = hashlib.sha256(file.read_bytes()).hexdigest()
          assert actual == expected, ("IPA digest mismatch", actual, expected)
          doc = json.loads((root / "build-manifest.json").read_text())
          assert doc["ipa_sha256"] == actual
          assert doc["upstream_commit"] == "f9c12c93620af4c4c5f5f65f9793b72f883be682"
          assert doc["status"] == "Built; iPad physical boot validation pending"
          with zipfile.ZipFile(file) as ipa:
              assert ipa.testzip() is None
              info = plistlib.loads(ipa.read("Payload/Henge.app/Info.plist"))
              assert info["CFBundleIdentifier"] == "com.henge.app"
              assert 2 in info["UIDeviceFamily"]
              app = ipa.read("Payload/Henge.app/Henge")
              assert b"henge.safeStartup.m4" in app
              assert b"M4 conservative startup:" in app
          print("PASS: Verified 0.2 M4 SafeBoot IPA sha256=" + actual)
          PY

      - name: Publish direct IPA as GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          notes="Experimental Henge 0.2.0 iPad M4 safe-startup IPA, built by Xcode 27.1 runner $SOURCE_RUN from official upstream commit f9c12c9. Conservative startup: 4 vCPU max, 8 GiB RAM max, Superblocks and quicker wake off. Boot fix remains unverified on physical iPad. Re-sign the ad-hoc IPA with your own certificate. Preserve/export your virtual Mac and do not delete the original app or VM data. IPA SHA256: $EXPECTED_SHA256."
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists; preserving its published asset."
            exit 0
          fi
          gh release create "$RELEASE_TAG" "release/$IPA" "release/build-manifest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Henge 0.2 M4 SafeBoot (experimental)" \
            --notes "$notes" \
            --prerelease
          echo "Direct IPA: https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$IPA" >> "$GITHUB_STEP_SUMMARY"
